name: Import approved Imagine reel
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify approved MP4s (no Instagram calls)
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error 'https://stompwick.com/media/imagine-quiet-garden-FINAL.mp4' -o imagine-quiet-garden-FINAL-17837c44.mp4
          printf '%s\n' '17837c44407b3fa83199f04ced7f33389f62014fb1bb630296d912ba91c12fe0  imagine-quiet-garden-FINAL-17837c44.mp4' | sha256sum --check --status
          git add -- imagine-quiet-garden-FINAL-17837c44.mp4
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Import verified approved Imagine reel'
          git push
