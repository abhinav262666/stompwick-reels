name: Import approved Imagine reel
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify approved MP4s (no Instagram calls)
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error 'https://stompwick.com/media/colour3-leaf-plates-hook-FINAL-v3b.mp4' -o colour3-leaf-plates-hook-FINAL-v3b-3916e948.mp4
          printf '%s\n' '3916e94813d31eb0be5baef9abf502b24997a2408221287481575b59475536e0  colour3-leaf-plates-hook-FINAL-v3b-3916e948.mp4' | sha256sum --check --status
          git add -- colour3-leaf-plates-hook-FINAL-v3b-3916e948.mp4
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Import verified Colour #3 v3b reel'
          git push
