name: Import approved Stompwick reels
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify three approved reels only (no Instagram calls)
        shell: bash
        run: |
          set -euo pipefail
          fetch_verify() {
            url="$1" expected="$2" filename="$3"
            curl --fail --location --silent --show-error "$url" -o "$filename"
            printf "%s  %s\n" "$expected" "$filename" | sha256sum --check --strict
            git add -- "$filename"
          }
          fetch_verify "https://stompwick.com/media/colour-reel-v4-7410c5e3c74a.mp4" "08d298ac8709bd5ab570fcbe890fa88d254d85b07bd9807b72812164ee7bc4d4" "colour-reel-V4-hook-text-voiced.mp4"
          fetch_verify "https://stompwick.com/media/draw-a-leaf-7b4e84eee3c2.mp4" "a82bf819676ce2063754d17f8eb03e15e19c72ad57cc76592860c240bab617c0" "draw-a-leaf-with-stompwick-voiced.mp4"
          fetch_verify "https://stompwick.com/media/imagine-rainy-day-c4a5e49dbb2b.mp4" "4cb3f9e0fc6f98c22fce4ae573ce301e9058e2a9a668a2be9c4e768c141b48b7" "imagine-rainy-day-composite-voiced.mp4"
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --cached --quiet; then git commit -m "Import approved Stompwick Instagram reels"; git push; fi
